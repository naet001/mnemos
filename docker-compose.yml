services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mnemos-db
    environment:
      POSTGRES_USER: mnemos
      POSTGRES_PASSWORD: mnemos
      POSTGRES_DB: mnemos
    ports:
      - "5432:5432"
    volumes:
      - mnemos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mnemos-pgdata:
